<!DOCTYPE html>
<html lang="en" data-look="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5d45"><title>Field Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Exo+2:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@500;600&family=Pixelify+Sans:wght@400;500;600&family=Press+Start+2P&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=15"></head>
<body><main class="wrap">
<header class="top" id="top"><div class="grow">
<p class="eyebrow">Field journal</p>
<input id="dayTitle" class="day-title" aria-label="Name this day" placeholder="New Day">
<p id="dateLabel" class="muted"></p></div>
<button id="lookBtn" class="pill" type="button" title="Choose a look" aria-haspopup="dialog" aria-expanded="false">Look</button></header>
<div id="home">
<section class="home-block" aria-labelledby="goalsHeading">
<h2 class="home-heading" id="goalsHeading">Goals</h2>
<div id="goals" class="goal-grid"></div>
</section>
<section class="home-block" aria-labelledby="entriesHeading">
<h2 class="home-heading" id="entriesHeading">Entries</h2>
<div id="categories" class="cat-grid"></div>
</section>
<section class="card mt8">
<div class="cal-head"><button id="prevMonth" class="circle" aria-label="Previous month">&#8249;</button>
<div class="center"><p id="calDay" class="lg"></p><button id="calMonth" class="month-btn" type="button" aria-haspopup="dialog" aria-expanded="false">Month</button></div>
<button id="nextMonth" class="circle" aria-label="Next month">&#8250;</button></div>
<div class="cal-nav"><button id="earlier">Earlier</button><button id="today">Today</button><button id="later">Later</button></div>
<div id="monthPicker" class="picker" role="dialog" aria-label="Choose month and year" hidden></div>
<div id="calGrid" class="cal-grid"></div></section>
<section class="card mt4"><h2>Days</h2><p id="daysEmpty" class="muted">Name a day, or save an entry, and it will show up here.</p><div id="daysList" class="days"></div></section>
</div>
<section id="catScreen" class="cat-screen" hidden></section>
<section id="goalScreen" class="cat-screen" hidden></section>
</main>
<div id="lookModal" class="look-modal" hidden>
<div class="look-panel card" role="dialog" aria-modal="true" aria-labelledby="lookTitle">
<div class="row look-head"><h2 id="lookTitle">Look</h2><button type="button" id="lookClose" class="btn ghost">Close</button></div>
<p class="muted sm">Paper is the default. A look covers every screen. Customize recolours it, including Paper, and Save theme keeps a named copy.</p>
<div id="lookList" class="look-list"></div>
<div id="lookCustom"></div>
</div></div>
<div id="lightbox" class="lightbox" hidden>
<button type="button" id="lightboxClose" class="lightbox-close">Close</button>
<img id="lightboxImg" alt="Attached image">
</div>
<script src="app.js?v=15"></script></body></html>
